name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Backend baked into the app. Override with the repo variable SERVER_URL.
  EXPO_PUBLIC_SERVER_URL: ${{ vars.SERVER_URL || 'https://api.rkb.saviinfotech.com' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --legacy-peer-deps

      # android/ is not committed; generate it from app.json
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      # Sign with our permanent key so every new APK installs over the old one
      - name: Sign APK with release keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp android/app/build/outputs/apk/release/app-release*.apk unsigned.apk
          zip -q -d unsigned.apk 'META-INF/*' || true
          $BT/zipalign -f -p 4 unsigned.apk aligned.apk
          $BT/apksigner sign --ks "$RUNNER_TEMP/release.p12" --ks-type pkcs12 \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --min-sdk-version 24 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out rkapp.apk aligned.apk
          $BT/apksigner verify -v --print-certs rkapp.apk | head -12
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: rkapp-apk
          path: rkapp.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RKApp build ${{ github.run_number }}
          files: rkapp.apk
          make_latest: true
